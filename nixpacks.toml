[phases.setup]
nixPkgs = ["python311", "curl", "ffmpeg", "cloudflare-warp"]

[phases.install]
cmds = [
  "python3 -m ensurepip --upgrade",
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install requests lxml flask gunicorn yt-dlp"
]

[phases.build]
cmds = ["chmod +x start.sh"]

[start]
cmd = "bash start.sh"